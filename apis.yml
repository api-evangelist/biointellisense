apis:
- aid: biointellisense:biocloud
  name: BioIntelliSense BioCloud API
  description: 'The BioCloud data-as-a-service platform API that ingests continuous
    vital-signs telemetry from BioButton / BioSticker wearables via BioHub gateways
    and the BioMobile app, and serves it to BioDashboard and to customer EMR/EHR and
    third-party integrations. The host is live and answers on every probed path with
    the same JSON 401 envelope, so the surface is confirmed to exist but is entirely
    auth-gated: no anonymous OpenAPI, no public developer portal, no self-service sign-up.
    Access is arranged commercially under a Master Services Agreement.'
  humanURL: https://www.biointellisense.com/biodashboard/
