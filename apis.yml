aid: biointellisense
name: BioIntelliSense
description: 'BioIntelliSense is a Golden, Colorado continuous health monitoring company
  whose FDA-cleared BioButton multi-patient wearable, BioSticker, BioHub cellular/Wi-Fi
  gateways, BioMobile smartphone app and BioDashboard exception-management software
  stream medical-grade vital signs — heart rate, respiratory rate, skin temperature,
  body position, activity and sleep — from in-facility acute care through post-acute
  and at-home remote patient monitoring. Device telemetry flows over Bluetooth to a
  gateway and into the BioCloud data-as-a-service platform, where analytics and clinician
  alerting run and where third-party and EMR/EHR integrations (HL7 into Epic and peers)
  consume the data. The BioCloud API host is live but entirely authentication-gated,
  with no publicly published developer portal, OpenAPI definition, SDKs or self-service
  onboarding — integration is arranged commercially under a Master Services Agreement.'
